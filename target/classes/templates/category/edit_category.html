<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Edit Category</title>

	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet">
	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
			rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="/images/kr.png">

	<style type="text/css">
		#formAlert {
			border-radius: .5rem;
			font-size: .9rem;
		}
	</style>
</head>

<body>

<div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

<!-- Note: include the category id in the URL -->
<form id="editCategoryForm" th:action="@{|/categories/edit/${category.id}|}"
	  th:object="${category}" method="post" th:data-id="${category.id}">

	<!-- Category Name -->
	<div class="mb-3">
		<label class="form-label">Category Name</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-tags"></i>
             </span> <input type="text" th:field="*{name}" class="form-control"
							placeholder="Enter category name" required>
		</div>
	</div>

	<!-- Description -->
	<div class="mb-3">
		<label class="form-label">Description</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-card-text"></i>
             </span>
			<textarea th:field="*{description}" class="form-control" rows="3"
					  placeholder="Enter category description" style="resize: none;"></textarea>
		</div>
	</div>

	<!-- Status -->
	<div class="mb-3">
		<label class="form-label">Status</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-info-circle"></i>
             </span> <select th:field="*{status}" class="form-select">
			<option value="Active" th:selected="${category.status == 'Active'}">Active</option>
			<option value="Inactive"
					th:selected="${category.status == 'Inactive'}">Inactive</option>
		</select>
		</div>
	</div>

	<!-- Buttons -->
	<div class="d-flex justify-content-center gap-3 mt-4">
		<a href="/categories" class="btn btn-secondary flex-fill text-center">
			<i class="bi bi-x-circle me-1"></i> Cancel
		</a>

		<button type="submit" class="btn btn-success" id="updateBtn">
			<i class="bi bi-pencil-square me-1"></i> Update
		</button>
	</div>

</form>


<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
	document.getElementById('editCategoryForm').addEventListener('submit', function (e) {
		e.preventDefault();

		const form = e.target;
		const updateBtn = document.getElementById('updateBtn');
		const alertBox = document.getElementById('formAlert');
		const categoryId = form.dataset.id;

		alertBox.classList.add('d-none');
		alertBox.textContent = '';

		const originalBtnHtml = updateBtn.innerHTML;
		updateBtn.disabled = true;
		updateBtn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Updating...';

		const formData = new URLSearchParams(new FormData(form));

		fetch('/categories/edit/' + categoryId, {
			method: 'PUT',
			headers: {
				'Content-Type': 'application/x-www-form-urlencoded',
				'Accept': 'application/json'
			},
			body: formData
		})
				.then(async (response) => {
					if (response.ok) {
						// Category updated successfully — go back to the list
						window.location.href = '/categories';
						return;
					}

					let message = 'Something went wrong while updating the category.';
					if (response.status === 404) {
						message = 'Category not found. It may have already been deleted.';
					} else {
						try {
							const data = await response.json();
							if (data && data.message) {
								message = data.message;
							}
						} catch (err) {
							// response wasn't JSON, keep default message
						}
					}

					alertBox.textContent = message;
					alertBox.classList.remove('d-none');
				})
				.catch(() => {
					alertBox.textContent = 'Unable to reach the server. Please try again.';
					alertBox.classList.remove('d-none');
				})
				.finally(() => {
					updateBtn.disabled = false;
					updateBtn.innerHTML = originalBtnHtml;
				});
	});
</script>

</body>
</html>
