<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Categories Listing</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap"
	rel="stylesheet">
<link rel="icon" type="image/png" href="/images/kr.png">

<style type="text/css">
/* Action buttons */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* Table formatting */
.category-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.category-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.category-table tbody tr {
	transition: background-color .12s ease;
}

.category-table tbody tr:hover {
	background-color: #f4f7fb;
}

.category-table {
	border-radius: 10px;
}

.category-name {
	font-weight: 600;
	color: #212529;
}

/* Status pill */
.status-pill {
	display: inline-flex;
	align-items: center;
	gap: .35rem;
	padding: .3em .65em;
	border-radius: 999px;
	font-size: .78rem;
	font-weight: 600;
}

.status-pill.active {
	background-color: rgba(25, 135, 84, .12);
	color: #198754;
}

.status-pill.inactive {
	background-color: rgba(220, 53, 69, .12);
	color: #dc3545;
}

/* Created At */
.created-at {
	color: #6c757d;
	font-size: .87rem;
}

/* Table wrapper */
.table-scroll-wrap {
	max-height: 500px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* Pagination Button Group Styling */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}

/* ================= 17" LAPTOP (~1600px - 1920px, 100% browser zoom) ================= */
@media ( min-width : 1600px) {
	.content {
		padding: 2rem 3rem !important;
	}
	.mb-3[style*="width: 50%"] {
		width: 35% !important;
	}
	.table-scroll-wrap {
		max-height: 650px;
	}
	.category-table thead th {
		font-size: .9rem;
		padding: .9rem 1rem;
	}
	.category-table tbody td {
		font-size: 1rem;
		padding: .8rem 1rem;
	}
	.status-pill {
		font-size: .85rem;
	}
	.btn-action {
		width: 38px;
		height: 38px;
		font-size: 1.05rem;
	}
}
</style>
</head>

<body>
	<div class="d-flex">

		<div th:replace="fragments/sidebar :: sidebar"></div>

		<div class="content p-4 w-100">
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<h1 class="mb-3">
				<i class="bi bi-tags me-2"></i> Categories Listing
			</h1>

			<!-- Bulk Delete Form Container -->
			<form id="bulkDeleteForm" th:action="@{/categories/delete-multiple}"
				method="post">
				<input type="hidden" name="_method" value="delete">
				<div class="mb-3 d-flex gap-2">
					<button type="button" class="btn btn-primary"
						data-bs-toggle="modal" data-bs-target="#addCategoryModal">
						<i class="bi bi-plus-circle me-1"></i> Add Category
					</button>

					<button type="button" id="btnBulkDelete"
						class="btn btn-danger d-none" data-bs-toggle="modal"
						data-bs-target="#bulkDeleteModal">
						<i class="bi bi-trash me-1"></i> Delete Selected (<span
							id="selectCount">0</span>)
					</button>
				</div>

				<div class="mb-3" style="width: 50%;">
					<div class="input-group">
						<span class="input-group-text" id="search-icon"
							style="background-color: white; border-right: 0;"> <i
							class="bi bi-search"></i>
						</span> <input type="text" id="categorySearch" class="form-control"
							placeholder="Search categories..."
							style="background-color: white; border-left: 0;">
					</div>
				</div>

				<div class="table-scroll-wrap">
					<table class="table table-hover align-middle category-table mb-0">
						<thead class="table-dark sticky-top">
							<tr>
								<th style="width: 40px; position: sticky" class="text-center"><input
									type="checkbox" id="selectAll" class="form-check-input">
								</th>
								<th>ID</th>
								<th>Category Name</th>
								<th>Status</th>
								<th>Created At</th>
								<th class="text-center">Actions</th>
							</tr>
						</thead>

						<tbody style="font-family: 'Noto Sans Khmer', Arial, sans-serif;">
							<tr th:each="category, iterStat : ${categories}">
								<td class="text-center"><input type="checkbox"
									name="categoryIds" th:value="${category.id}"
									class="form-check-input row-checkbox"></td>
								<td th:text="${iterStat.count}"></td>
								<td class="category-name" th:text="${category.name}"></td>

								<td><span th:if="${category.status == 'Active'}"
									class="status-pill active"> <i
										class="bi bi-check-circle"></i> <span
										th:text="${category.status}"></span>
								</span> <span th:if="${category.status == 'Inactive'}"
									class="status-pill inactive"> <i class="bi bi-x-circle"></i>
										<span th:text="${category.status}"></span>
								</span></td>

								<td class="created-at"
									th:text="${#temporals.format(category.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

								<td class="action-cell">
									<button type="button" class="btn btn-warning btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#editCategoryModal"
										th:attr="data-id=${category.id}" title="Edit Category">
										<i class="bi bi-pencil-square"></i>
									</button>

									<button type="button" class="btn btn-danger btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#deleteModal"
										th:attr="data-id=${category.id}, data-name=${category.name}"
										title="Delete Category">
										<i class="bi bi-trash"></i>
									</button>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(categories)}">
								<td colspan="6" class="text-center py-4 text-muted"><i
									class="bi bi-inbox fs-4 d-block mb-1"></i> No categories found.
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<!-- Pagination & Entries Controls -->
				<div
					class="d-flex justify-content-between align-items-center mt-3 px-1"
					style="font-size: 0.9rem;">
					<!-- Left: Page Size Selector -->
					<div class="d-flex align-items-center gap-2 text-secondary">
						<label for="pageSizeSelect"
							class="form-label mb-0 fw-semibold text-dark">Show</label> <select
							id="pageSizeSelect"
							class="form-select form-select-sm shadow-none"
							style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
							<option value="10" selected>10</option>
							<option value="25">25</option>
							<option value="50">50</option>
							<option value="all">All</option>
						</select> <span>entries per page</span>
					</div>

					<!-- Right: Info Text & Clean Button Group -->
					<div class="d-flex align-items-center gap-3">
						<span id="pageInfo" class="text-secondary">Showing 0 to 0
							of 0 entries</span>

						<div class="btn-group btn-group-sm custom-pagination-group"
							role="group" aria-label="Page Navigation">
							<button type="button" class="btn btn-light border text-secondary"
								id="prevPageBtn" disabled
								style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
								<i class="bi bi-chevron-left me-1"></i> Previous
							</button>
							<button type="button"
								class="btn btn-light border text-primary fw-medium"
								id="nextPageBtn" disabled
								style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
								Next <i class="bi bi-chevron-right ms-1"></i>
							</button>
						</div>
					</div>
				</div>

				<!-- Bulk Delete Modal -->
				<div class="modal fade" id="bulkDeleteModal" tabindex="-1"
					aria-labelledby="bulkDeleteModalLabel" aria-hidden="true">
					<div class="modal-dialog modal-dialog-centered">
						<div class="modal-content">
							<div class="modal-header bg-danger text-white">
								<h5 class="modal-title" id="bulkDeleteModalLabel">
									<i class="bi bi-exclamation-triangle"></i> Confirm Bulk Delete
								</h5>
								<button type="button" class="btn-close btn-close-white"
									data-bs-dismiss="modal" aria-label="Close"></button>
							</div>
							<div class="modal-body">
								<p class="mb-0">Are you sure you want to delete all selected
									categories?</p>
							</div>
							<div class="modal-footer">
								<div class="row g-2 w-100">
									<div class="col">
										<button type="button" class="btn btn-secondary w-100"
											data-bs-dismiss="modal">
											<i class="bi bi-x-circle me-1"></i> Cancel
										</button>
									</div>
									<div class="col">
										<button type="submit" id="confirmBulkDeleteBtn"
											class="btn btn-danger w-100">
											<i class="bi bi-trash me-1"></i> Yes, Delete Selected!
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</form>
		</div>
	</div>

	<!-- Modals outside form -->
	<div class="modal fade" id="addCategoryModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header bg-primary text-white justify-content-center">
					<h5 class="modal-title text-center">
						<i class="bi bi-plus-circle"></i> Add Category
					</h5>
				</div>
				<div class="modal-body" id="addCategoryForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="editCategoryModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-warning justify-content-center">
					<h5 class="modal-title">
						<i class="bi bi-pencil-square"></i> Edit Category
					</h5>
				</div>
				<div class="modal-body" id="editCategoryForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="deleteModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
				</div>
				<div class="modal-body">
					Are you sure you want to delete: <strong id="deleteCategoryName"></strong>?
				</div>
				<div class="modal-footer">
					<form id="deleteForm" method="post" class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
	document.addEventListener("DOMContentLoaded", () => {
		// Toast Initialization
		const toasts = document.querySelectorAll('.toast.show');
		toasts.forEach(toastEl => {
			const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
			bsToast.show();
		});

		// Checkbox & Bulk Delete Elements
		const selectAll = document.getElementById('selectAll');
		const btnBulkDelete = document.getElementById('btnBulkDelete');
		const selectCount = document.getElementById('selectCount');

		// Search & Pagination Elements
		const categorySearch = document.getElementById('categorySearch');
		const pageSizeSelect = document.getElementById('pageSizeSelect');
		const prevPageBtn = document.getElementById('prevPageBtn');
		const nextPageBtn = document.getElementById('nextPageBtn');
		const pageInfo = document.getElementById('pageInfo');
		const tableRows = Array.from(document.querySelectorAll('tbody tr')).filter(row => !row.querySelector('td[colspan="6"]'));

		let currentPage = 1;
		let pageSize = parseInt(pageSizeSelect.value, 10);

		function updateBulkDeleteButton() {
			const rowCheckboxes = document.querySelectorAll('.row-checkbox');
			const visibleCheckboxes = Array.from(rowCheckboxes).filter(
				cb => cb.closest('tr').style.display !== 'none'
			);
			const checkedCount = visibleCheckboxes.filter(cb => cb.checked).length;

			if (checkedCount > 0) {
				btnBulkDelete.classList.remove('d-none');
				selectCount.textContent = checkedCount;
			} else {
				btnBulkDelete.classList.add('d-none');
			}

			if (visibleCheckboxes.length > 0) {
				selectAll.checked = checkedCount === visibleCheckboxes.length;
				selectAll.indeterminate = checkedCount > 0 && checkedCount < visibleCheckboxes.length;
			} else {
				selectAll.checked = false;
				selectAll.indeterminate = false;
			}
		}

		if (selectAll) {
			selectAll.addEventListener('change', function() {
				document.querySelectorAll('.row-checkbox').forEach(cb => {
					if (cb.closest('tr').style.display !== 'none') {
						cb.checked = selectAll.checked;
					}
				});
				updateBulkDeleteButton();
			});
		}

		document.addEventListener('change', function(e) {
			if (e.target.classList.contains('row-checkbox')) {
				updateBulkDeleteButton();
			}
		});

		// Core Search + Pagination Renderer
		function updateTableDisplay() {
			const filter = categorySearch.value.toLowerCase();

			// Filter matching rows
			const matchingRows = tableRows.filter(row => {
				const categoryName = row.cells[2]?.textContent.toLowerCase() || '';
				return categoryName.includes(filter);
			});

			const totalEntries = matchingRows.length;
			const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

			if (currentPage > totalPages) currentPage = totalPages;
			if (currentPage < 1) currentPage = 1;

			// Hide all table rows and uncheck hidden checkboxes
			tableRows.forEach(row => {
				row.style.display = 'none';
				const cb = row.querySelector('.row-checkbox');
				if (cb) cb.checked = false;
			});

			// Slice rows for current pagination page
			let startIndex = 0;
			let endIndex = totalEntries;

			if (pageSize !== -1 && totalEntries > 0) {
				startIndex = (currentPage - 1) * pageSize;
				endIndex = Math.min(startIndex + pageSize, totalEntries);
			}

			for (let i = startIndex; i < endIndex; i++) {
				if (matchingRows[i]) matchingRows[i].style.display = '';
			}

			// Handle empty message row display
			const noDataRow = document.querySelector('tbody tr td[colspan="6"]')?.parentElement;
			if (noDataRow) {
				noDataRow.style.display = totalEntries === 0 ? '' : 'none';
			}

			// Update pagination text and buttons state
			if (totalEntries === 0) {
				pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
			} else {
				const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
				pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
			}

			prevPageBtn.disabled = currentPage <= 1;
			nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;

			selectAll.checked = false;
			updateBulkDeleteButton();
		}

		// Control Event Handlers
		categorySearch.addEventListener('keyup', () => {
			currentPage = 1;
			updateTableDisplay();
		});

		pageSizeSelect.addEventListener('change', function() {
			pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
			currentPage = 1;
			updateTableDisplay();
		});

		prevPageBtn.addEventListener('click', () => {
			if (currentPage > 1) {
				currentPage--;
				updateTableDisplay();
			}
		});

		nextPageBtn.addEventListener('click', () => {
			currentPage++;
			updateTableDisplay();
		});

		// Dynamic Modal Loaders
		document.getElementById('addCategoryModal').addEventListener('show.bs.modal', () => {
			fetch('/categories/add')
					.then(res => res.text())
					.then(html => document.getElementById('addCategoryForm').innerHTML = html);
		});

		document.getElementById('editCategoryModal').addEventListener('show.bs.modal', e => {
			const id = e.relatedTarget.getAttribute('data-id');
			fetch(`/categories/edit/${id}`)
					.then(res => res.text())
					.then(html => document.getElementById('editCategoryForm').innerHTML = html);
		});

		document.getElementById('deleteModal').addEventListener('show.bs.modal', function(e) {
			const button = e.relatedTarget;
			const categoryId = button.getAttribute('data-id');
			const categoryName = button.getAttribute('data-name');

			document.getElementById('deleteCategoryName').textContent = categoryName;
			document.getElementById('deleteForm').setAttribute('action', '/categories/delete/' + categoryId);
		});

		// Initial display rendering
		updateTableDisplay();
	});
</script>
</body>
</html>
