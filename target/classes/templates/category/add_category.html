<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Add Category</title>

	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet">
	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
			rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="/images/kr.png">

	<style type="text/css">
		/* ================= ADD CATEGORY FORM ================= */
		.category-form .form-label {
			font-weight: 600;
			font-size: .85rem;
			text-transform: uppercase;
			letter-spacing: .03em;
			color: #495057;
			margin-bottom: .5rem;
		}

		.category-form .input-group-text {
			background-color: #f8f9fa;
			border-right: 0;
			color: #6c757d;
			width: 42px;
			justify-content: center;
			transition: background-color .15s ease, color .15s ease;
		}

		.category-form .form-control,
		.category-form .form-select {
			border-left: 0;
			padding-top: .6rem;
			padding-bottom: .6rem;
		}

		.category-form .input-group {
			border-radius: .5rem;
			overflow: hidden;
			box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
		}

		.category-form .input-group:focus-within .input-group-text {
			background-color: #e7f1ff;
			color: #0d6efd;
		}

		.category-form .input-group:focus-within {
			box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .15);
		}

		.category-form .form-control:focus,
		.category-form .form-select:focus {
			box-shadow: none;
			border-color: #86b7fe;
		}

		.category-form textarea.form-control {
			min-height: 90px;
		}

		.category-form .mb-3 {
			margin-bottom: 1.25rem !important;
		}

		.category-form .form-actions {
			border-top: 1px solid #eef0f2;
			padding-top: 1.25rem;
		}

		.category-form .form-actions .btn {
			padding: .55rem 1.4rem;
			font-weight: 500;
			border-radius: .5rem;
		}

		.category-form .alert {
			border-radius: .5rem;
			font-size: .9rem;
		}
	</style>
</head>

<body>

<div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

<form id="addCategoryForm" th:action="@{/categories/add}" th:object="${category}"
	  method="post" class="category-form">

	<!-- Category Name -->
	<div class="mb-3">
		<label class="form-label">Category Name</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-tags"></i>
             </span> <input type="text" th:field="*{name}" class="form-control"
							placeholder="Enter category name" required>
		</div>
	</div>

	<!-- Description -->
	<div class="mb-3">
		<label class="form-label">Description</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-card-text"></i>
             </span>
			<textarea th:field="*{description}" class="form-control" rows="3"
					  placeholder="Enter category description" style="resize: none;"></textarea>
		</div>
	</div>

	<!-- Status -->
	<div class="mb-3">
		<label class="form-label">Status</label>
		<div class="input-group">
             <span class="input-group-text"> <i class="bi bi-info-circle"></i>
             </span> <select th:field="*{status}" class="form-select">
			<option value="Active">Active</option>
			<option value="Inactive">Inactive</option>
		</select>
		</div>
	</div>

	<!-- Buttons -->
	<div class="d-flex justify-content-between form-actions">
		<a href="/categories" class="btn btn-secondary"> <i
				class="bi bi-x-circle me-1"></i> Cancel
		</a>

		<button type="submit" class="btn btn-success" id="saveBtn">
			<i class="bi bi-save me-1"></i> Save
		</button>
	</div>

</form>

<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
	document.getElementById('addCategoryForm').addEventListener('submit', function (e) {
		e.preventDefault();

		const form = e.target;
		const saveBtn = document.getElementById('saveBtn');
		const alertBox = document.getElementById('formAlert');

		alertBox.classList.add('d-none');
		alertBox.textContent = '';

		const originalBtnHtml = saveBtn.innerHTML;
		saveBtn.disabled = true;
		saveBtn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Saving...';

		const formData = new URLSearchParams(new FormData(form));

		fetch(form.action, {
			method: 'POST',
			headers: {
				'Content-Type': 'application/x-www-form-urlencoded',
				'Accept': 'application/json'
			},
			body: formData
		})
				.then(async (response) => {
					if (response.ok) {
						// Category created successfully — go back to the list
						window.location.href = '/categories';
						return;
					}

					let message = 'Something went wrong while saving the category.';
					try {
						const data = await response.json();
						if (data && data.message) {
							message = data.message;
						}
					} catch (err) {
						// response wasn't JSON, keep default message
					}

					alertBox.textContent = message;
					alertBox.classList.remove('d-none');
				})
				.catch(() => {
					alertBox.textContent = 'Unable to reach the server. Please try again.';
					alertBox.classList.remove('d-none');
				})
				.finally(() => {
					saveBtn.disabled = false;
					saveBtn.innerHTML = originalBtnHtml;
				});
	});
</script>

</body>
</html>
