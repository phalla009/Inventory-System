	<!-- Exit -->
	<div class="p-3 border-top border-secondary-subtle">
		<button class="btn btn-outline-danger w-100 rounded-pill"
			data-bs-toggle="modal" data-bs-target="#exitModal">
			<i class="bi bi-box-arrow-right me-2"></i> Exit
		</button>
	</div>

	<!-- Logout Modal -->
	<div class="modal fade" id="exitModal" tabindex="-1"
		aria-labelledby="exitModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<!-- បន្ថែម text-dark នៅត្រង់នេះ ដើម្បីឱ្យអក្សរទាំងអស់ក្នុង Modal ទៅជាពណ៌ខ្មៅ -->
			<div class="modal-content text-dark">
				<div class="modal-header border-0">
					<!-- បន្ថែម text-dark លើចំណងជើង modal-title -->
					<h5 class="modal-title d-flex align-items-center gap-2 text-dark"
						id="exitModalLabel">
						<i class="bi bi-exclamation-triangle-fill text-warning"></i>
						Confirm Logout
					</h5>
					<!-- ដូរ btn-close-white មកជា btn-close ធម្មតា ដើម្បីឱ្យប៊ូតុង X ចេញពណ៌ខ្មៅ -->
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body text-center py-4">
					<i class="bi bi-box-arrow-right text-danger fs-1 mb-2"></i>
					<!-- បន្ថែម text-dark លើអត្ថបទ -->
					<p class="mt-2 mb-0 fs-5 fw-semibold text-dark">Are you sure
						you want to log out?</p>
				</div>
				<div class="modal-footer border-0 justify-content-center gap-3">
					<a href="/logout"
						class="btn btn-danger text-white px-4 rounded-pill"> <i
						class="bi bi-door-closed me-2"></i> Logout
					</a>
				</div>
			</div>
		</div>
	</div>
