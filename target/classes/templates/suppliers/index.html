<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Suppliers-Listing</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<!-- Favicon / Logo -->
<link rel="icon" type="image/png" href="/images/kr.png">
<style type="text/css">
/* ---- Action buttons ---- */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* ---- Table look & feel ---- */
.supplier-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.supplier-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.supplier-table tbody tr {
	transition: background-color .12s ease;
}

.supplier-table tbody tr:hover {
	background-color: #f4f7fb;
}

.supplier-table {
	border-radius: 10px;
}

.supplier-name {
	font-weight: 600;
	color: #212529;
}

.supplier-email {
	color: #0d6efd;
}

.supplier-address {
	color: #6c757d;
	font-size: .87rem;
}

/* ---- Gender pill ---- */
.gender-pill {
	display: inline-flex;
	align-items: center;
	gap: .3rem;
	padding: .28em .6em;
	border-radius: 999px;
	font-size: .78rem;
	font-weight: 600;
	background-color: rgba(13, 110, 253, .1);
	color: #0d6efd;
}

.gender-pill.female {
	background-color: rgba(214, 51, 132, .1);
	color: #d63384;
}

/* ---- Table wrapper ---- */
.table-scroll-wrap {
	max-height: 500px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* ---- Custom Pagination Group ---- */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main content -->
		<div class="content container-fluid mt-3">
			<h1 class="mb-3">
				<i class="bi bi-truck me-2"></i>Suppliers Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<!-- Error Toast -->
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- ✅ Add Supplier Button -->
			<button type="button" class="btn btn-primary mb-3"
				data-bs-toggle="modal" data-bs-target="#addSupplierModal">
				<i class="bi bi-plus-circle me-1"></i> Add Supplier
			</button>

			<!-- Search Suppliers -->
			<div class="mb-3" style="width: 50%;">
				<div class="input-group">
					<span class="input-group-text"
						style="background-color: white; border-right: 0;"> <i
						class="bi bi-search"></i>
					</span> <input type="text" id="supplierSearch" class="form-control"
						placeholder="Search suppliers by name, email, or phone..."
						style="background-color: white; border-left: 0;">
				</div>
			</div>

			<div class="table-scroll-wrap">
				<!-- ✅ Supplier Table -->
				<table class="table table-hover align-middle supplier-table mb-0">
					<thead class="table-dark text-center"
						style="position: sticky; top: 0; z-index: 2;">
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Gender</th>
							<th>Email</th>
							<th>Phone Number</th>
							<th>Address</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="s ,iterStat: ${suppliers}" class="text-center">
							<td th:text="${iterStat.count}"></td>
							<td class="supplier-name" th:text="${s.name}"></td>
							<td><span class="gender-pill"
								th:classappend="${s.gender == 'Female'} ? 'female' : ''"
								th:text="${s.gender}"></span></td>
							<td class="supplier-email" th:text="${s.email}"></td>
							<td th:text="${s.phone_number}"></td>
							<td class="supplier-address" th:text="${s.address}"></td>
							<td>
								<div class="action-cell">
									<button type="button" class="btn btn-warning btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#editSupplierModal"
										th:attr="data-id=${s.id}" title="Edit Supplier">
										<i class="bi bi-pencil-square"></i>
									</button>
									<button type="button" class="btn btn-danger btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#deleteModal"
										th:attr="data-id=${s.id}, data-name=${s.name}"
										title="Delete Supplier">
										<i class="bi bi-trash"></i>
									</button>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(suppliers)}">
							<td colspan="7" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No suppliers found.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Pagination & Entries Controls -->
			<div
				class="d-flex justify-content-between align-items-center mt-3 px-1"
				style="font-size: 0.9rem;">
				<!-- Left: Page Size Selector -->
				<div class="d-flex align-items-center gap-2 text-secondary">
					<label for="pageSizeSelect"
						class="form-label mb-0 fw-semibold text-dark">Show</label> <select
						id="pageSizeSelect" class="form-select form-select-sm shadow-none"
						style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
						<option value="10" selected>10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="all">All</option>
					</select> <span>entries per page</span>
				</div>

				<!-- Right: Info Text & Clean Button Group -->
				<div class="d-flex align-items-center gap-3">
					<span id="pageInfo" class="text-secondary">Showing 0 to 0 of
						0 entries</span>

					<div class="btn-group btn-group-sm custom-pagination-group"
						role="group" aria-label="Page Navigation">
						<button type="button" class="btn btn-light border text-secondary"
							id="prevPageBtn" disabled
							style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
							<i class="bi bi-chevron-left me-1"></i> Previous
						</button>
						<button type="button"
							class="btn btn-light border text-primary fw-medium"
							id="nextPageBtn" disabled
							style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
							Next <i class="bi bi-chevron-right ms-1"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Add Supplier Modal -->
	<div class="modal fade" id="addSupplierModal" tabindex="-1"
		aria-labelledby="addSupplierModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header bg-primary text-white justify-content-center position-relative">
					<h5 class="modal-title text-center" id="addSupplierModalLabel">
						<i class="bi bi-plus-circle"></i> Add New Supplier
					</h5>
				</div>

				<div class="modal-body" id="addSupplierForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit Supplier Modal -->
	<div class="modal fade" id="editSupplierModal" tabindex="-1"
		aria-labelledby="editSupplierModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<!-- Modal Header -->
				<div
					class="modal-header text-dark justify-content-center position-relative"
					style="background-color: #ffc107;">
					<h5 class="modal-title text-center" id="editSupplierModalLabel">
						<i class="bi bi-pencil-square"></i> Edit Supplier
					</h5>
				</div>

				<!-- Modal Body -->
				<div class="modal-body" id="editSupplierForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- ✅ Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title" id="deleteModalLabel">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>

				<div class="modal-body text-center">
					<p>Are you sure you want to delete this supplier?</p>
					<p>
						<strong id="deleteSupplierName"></strong>
					</p>
				</div>

				<div class="modal-footer">
					<form id="deleteForm" th:action="@{'/suppliers/delete/'}"
						method="post" class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- ✅ Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Combined Search + Pagination Script -->
	<script>
	document.addEventListener('DOMContentLoaded', function() {
		const supplierSearch = document.getElementById('supplierSearch');
		const pageSizeSelect = document.getElementById('pageSizeSelect');
		const prevPageBtn = document.getElementById('prevPageBtn');
		const nextPageBtn = document.getElementById('nextPageBtn');
		const pageInfo = document.getElementById('pageInfo');
		const tableRows = Array.from(document.querySelectorAll('tbody tr')).filter(row => !row.querySelector('td[colspan="7"]'));

		let currentPage = 1;
		let pageSize = parseInt(pageSizeSelect.value, 10);

		function updateTableDisplay() {
			const filter = supplierSearch.value.toLowerCase();

			// Filter rows based on Name, Email, or Phone
			const matchingRows = tableRows.filter(row => {
				const name = row.cells[1]?.textContent.toLowerCase() || '';
				const email = row.cells[3]?.textContent.toLowerCase() || '';
				const phone = row.cells[4]?.textContent.toLowerCase() || '';

				return name.includes(filter) || email.includes(filter) || phone.includes(filter);
			});

			const totalEntries = matchingRows.length;
			const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

			if (currentPage > totalPages) currentPage = totalPages;
			if (currentPage < 1) currentPage = 1;

			// Hide all data rows
			tableRows.forEach(row => row.style.display = 'none');

			// Slice rows for current pagination page
			let startIndex = 0;
			let endIndex = totalEntries;

			if (pageSize !== -1 && totalEntries > 0) {
				startIndex = (currentPage - 1) * pageSize;
				endIndex = Math.min(startIndex + pageSize, totalEntries);
			}

			for (let i = startIndex; i < endIndex; i++) {
				if (matchingRows[i]) matchingRows[i].style.display = '';
			}

			// Handle "No suppliers found" display
			const noDataRow = document.querySelector('tbody tr td[colspan="7"]')?.parentElement;
			if (noDataRow) {
				noDataRow.style.display = totalEntries === 0 ? '' : 'none';
			}

			// Update pagination text & buttons state
			if (totalEntries === 0) {
				pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
			} else {
				const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
				pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
			}

			prevPageBtn.disabled = currentPage <= 1;
			nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;
		}

		// Event listeners for Controls
		supplierSearch.addEventListener('keyup', () => {
			currentPage = 1;
			updateTableDisplay();
		});

		pageSizeSelect.addEventListener('change', function() {
			pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
			currentPage = 1;
			updateTableDisplay();
		});

		prevPageBtn.addEventListener('click', () => {
			if (currentPage > 1) {
				currentPage--;
				updateTableDisplay();
			}
		});

		nextPageBtn.addEventListener('click', () => {
			currentPage++;
			updateTableDisplay();
		});

		// Initial display render
		updateTableDisplay();
	});
	</script>

	<!-- Modal Loaders & Toast Scripts -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    // Add Modal Loader
		    const addSupplierModal = document.getElementById('addSupplierModal');
		    const addFormContainer = document.getElementById('addSupplierForm');
		
		    addSupplierModal.addEventListener('show.bs.modal', function() {
		        fetch('/suppliers/add')
		            .then(response => response.text())
		            .then(html => addFormContainer.innerHTML = html)
		            .catch(error => {
		                addFormContainer.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>';
		                console.error(error);
		            });
		    });
		
		    addSupplierModal.addEventListener('hidden.bs.modal', function() {
		        addFormContainer.innerHTML = '';
		    });

		    // Edit Modal Loader
		    const editSupplierModal = document.getElementById('editSupplierModal');
		    const editFormContainer = document.getElementById('editSupplierForm');
	
		    editSupplierModal.addEventListener('show.bs.modal', function(event) {
		        const button = event.relatedTarget;
		        const supplierId = button.getAttribute('data-id');
	
		        editFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
	
		        fetch(`/suppliers/edit/${supplierId}`) 
		            .then(response => {
		                if (!response.ok) throw new Error('Network response was not ok');
		                return response.text();
		            })
		            .then(html => editFormContainer.innerHTML = html)
		            .catch(error => {
		                editFormContainer.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>';
		                console.error('Error fetching edit form:', error);
		            });
		    });
	
		    editSupplierModal.addEventListener('hidden.bs.modal', function() {
		        editFormContainer.innerHTML = '';
		    });

		    // Delete Modal Logic
		    const deleteModal = document.getElementById('deleteModal');
		    const deleteForm = document.getElementById('deleteForm');
		    const deleteSupplierName = document.getElementById('deleteSupplierName');
		
		    deleteModal.addEventListener('show.bs.modal', function(event) {
		        const button = event.relatedTarget;
		        const supplierId = button.getAttribute('data-id');
		        const supplierName = button.getAttribute('data-name');
		
		        deleteSupplierName.textContent = supplierName;
		        deleteForm.action = '/suppliers/delete/' + supplierId;
		    });

		    // Toast Initialization
		    var toastElList = [].slice.call(document.querySelectorAll('.toast'));
		    toastElList.map(function (toastEl) {
		        var toast = new bootstrap.Toast(toastEl);
		        toast.show();
		    });
		});
	</script>
</body>
</html>
