<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sales Management</title>

<!-- Bootstrap & Icons CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<!-- Khmer Font & Favicon -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap"
	rel="stylesheet">
<link rel="icon" type="image/png" href="/images/kr.png">

<style type="text/css">
/* Action buttons (Styled like Category) */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* Table formatting */
.sales-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.sales-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.sales-table tbody tr {
	transition: background-color .12s ease;
}

.sales-table tbody tr:hover {
	background-color: #f4f7fb;
}

.sales-table {
	border-radius: 10px;
}

.customer-name {
	font-weight: 600;
	color: #212529;
}

/* Table wrapper */
.table-scroll-wrap {
	max-height: 500px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* Custom Pagination Styling */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}

/* Standardized 17" Laptop screen optimization */
@media ( min-width : 1600px) {
	.content {
		padding: 2rem 3rem !important;
	}
	.table-scroll-wrap {
		max-height: 650px;
	}
	.sales-table thead th {
		font-size: .9rem;
		padding: .9rem 1rem;
	}
	.sales-table tbody td {
		font-size: 1rem;
		padding: .8rem 1rem;
	}
	.btn-action {
		width: 38px;
		height: 38px;
		font-size: 1.05rem;
	}
}

@media print {
	.receipt {
		page-break-after: always;
	}
}
</style>
</head>
<body>

	<div class="d-flex">
		<!-- Sidebar Fragment -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Print Message Modal -->
		<div class="modal fade" id="printSalesModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header bg-warning text-dark">
						<h5 class="modal-title">
							<i class="bi bi-exclamation-triangle-fill me-2"></i>Warning
						</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body" id="printMessage">
						<!-- message will appear here -->
					</div>
				</div>
			</div>
		</div>

		<!-- Main Content -->
		<div class="content p-4 flex-grow-1">
			<h1 class="mb-3">
				<i class="bi bi-cash-stack me-2"></i>Sales Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- Action Buttons Container -->
			<div class="mb-3 d-flex gap-2">
				<button type="button" class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#addSalesModal">
					<i class="bi bi-plus-circle me-1"></i> Add Sale
				</button>
				<button type="button" id="btnPrintSelected" class="btn btn-success"
					style="width: 200px; border-radius: 24px">
					<i class="bi bi-printer me-1"></i> Print Selected
				</button>
			</div>

			<!-- Search Input -->
			<div class="mb-3" style="width: 50%;">
				<div class="input-group">
					<span class="input-group-text"
						style="background-color: white; border-right: 0;"> <i
						class="bi bi-search"></i>
					</span> <input type="text" id="salesSearch" class="form-control"
						placeholder="Search sales by customer or product..."
						style="background-color: white; border-left: 0;">
				</div>
			</div>

			<!-- Table Wrapper -->
			<div class="table-scroll-wrap">
				<table class="table table-hover align-middle sales-table mb-0">
					<thead class="table-dark sticky-top">
						<tr>
							<th style="width: 40px;" class="text-center"><input
								type="checkbox" id="selectAll" class="form-check-input">
							</th>
							<th>ID</th>
							<th>Sale Date</th>
							<th>Customer Name</th>
							<th>Product</th>
							<th>SubTotal ($)</th>
							<th>Discount (%)</th>
							<th>Total ($)</th>
							<th class="text-center">Actions</th>
						</tr>
					</thead>
					<tbody style="font-family: 'Noto Sans Khmer', Arial, sans-serif;">
						<tr th:each="sale, iterStat : ${salesList}">
							<td class="text-center"><input type="checkbox"
								class="form-check-input selectSale" th:value="${sale.id}" /></td>
							<td th:text="${iterStat.count}"></td>
							<td
								th:text="${sale.sale_date != null ? #temporals.format(sale.sale_date, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
							<td class="customer-name" th:text="${sale.customer_name}"></td>
							<td th:text="${sale.product != null ? sale.product.name : 'N/A'}"></td>
							<td
								th:text="${#numbers.formatDecimal(sale.subtotal, 1, 2)} + ' $'"></td>
							<td th:text="${sale.discount} + '%'"></td>
							<td class="fw-bold text-success"
								th:text="${#numbers.formatDecimal(sale.subtotal - (sale.subtotal * (sale.discount / 100)), 1, 2)} + ' $'"></td>
							<td class="action-cell">
								<button type="button" class="btn btn-warning btn-sm btn-action"
									data-bs-toggle="modal" data-bs-target="#editSalesModal"
									th:attr="data-id=${sale.id}" title="Edit Sale">
									<i class="bi bi-pencil-square"></i>
								</button>
								<button type="button" class="btn btn-danger btn-sm btn-action"
									data-bs-toggle="modal" data-bs-target="#deleteModal"
									th:attr="data-id=${sale.id}, data-name=${sale.customer_name}"
									title="Delete Sale">
									<i class="bi bi-trash"></i>
								</button>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(salesList)}">
							<td colspan="9" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No sales records
								found.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Pagination & Entries Controls -->
			<div
				class="d-flex justify-content-between align-items-center mt-3 px-1"
				style="font-size: 0.9rem;">
				<!-- Left: Page Size Selector -->
				<div class="d-flex align-items-center gap-2 text-secondary">
					<label for="pageSizeSelect"
						class="form-label mb-0 fw-semibold text-dark">Show</label> <select
						id="pageSizeSelect" class="form-select form-select-sm shadow-none"
						style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
						<option value="10" selected>10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="all">All</option>
					</select> <span>entries per page</span>
				</div>

				<!-- Right: Info Text & Clean Button Group -->
				<div class="d-flex align-items-center gap-3">
					<span id="pageInfo" class="text-secondary">Showing 0 to 0 of
						0 entries</span>

					<div class="btn-group btn-group-sm custom-pagination-group"
						role="group" aria-label="Page Navigation">
						<button type="button" class="btn btn-light border text-secondary"
							id="prevPageBtn" disabled
							style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
							<i class="bi bi-chevron-left me-1"></i> Previous
						</button>
						<button type="button"
							class="btn btn-light border text-primary fw-medium"
							id="nextPageBtn" disabled
							style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
							Next <i class="bi bi-chevron-right ms-1"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Add Sales Modal -->
	<div class="modal fade" id="addSalesModal" tabindex="-1"
		aria-labelledby="addSalesModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header bg-primary text-white justify-content-center position-relative">
					<h5 class="modal-title text-center" id="addSalesModalLabel">
						<i class="bi bi-plus-circle"></i> Add New Sales
					</h5>
				</div>
				<div class="modal-body" id="addSalesForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit Sales Modal -->
	<div class="modal fade" id="editSalesModal" tabindex="-1"
		aria-labelledby="editSalesModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header text-dark justify-content-center position-relative"
					style="background-color: #ffc107;">
					<h5 class="modal-title text-center" id="editSalesModalLabel">
						<i class="bi bi-pencil-square"></i> Edit Sales
					</h5>
				</div>
				<div class="modal-body" id="editSalesForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title" id="deleteModalLabel">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body text-center">
					<p>Are you sure you want to delete this sale?</p>
					<p>
						<strong id="deleteProductName"></strong>
					</p>
				</div>
				<div class="modal-footer">
					<form id="deleteForm" th:action="@{/sales/delete/}" method="post"
						class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Script Management -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			// Search & Pagination Controls
			const salesSearch = document.getElementById('salesSearch');
			const pageSizeSelect = document.getElementById('pageSizeSelect');
			const prevPageBtn = document.getElementById('prevPageBtn');
			const nextPageBtn = document.getElementById('nextPageBtn');
			const pageInfo = document.getElementById('pageInfo');
			const selectAll = document.getElementById('selectAll');
			const tableRows = Array.from(document.querySelectorAll('tbody tr')).filter(row => !row.querySelector('td[colspan="9"]'));

			let currentPage = 1;
			let pageSize = parseInt(pageSizeSelect.value, 10);

			function updateTableDisplay() {
				const filter = salesSearch ? salesSearch.value.toLowerCase() : '';

				// Filter rows matching Customer Name (col index 3) or Product Name (col index 4)
				const matchingRows = tableRows.filter(row => {
					const customerName = row.cells[3]?.textContent.toLowerCase() || '';
					const productName = row.cells[4]?.textContent.toLowerCase() || '';
					return customerName.includes(filter) || productName.includes(filter);
				});

				const totalEntries = matchingRows.length;
				const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

				if (currentPage > totalPages) currentPage = totalPages;
				if (currentPage < 1) currentPage = 1;

				// Hide all data rows and reset checkboxes on hidden rows
				tableRows.forEach(row => {
					row.style.display = 'none';
					const cb = row.querySelector('.selectSale');
					if (cb) cb.checked = false;
				});

				// Slice rows for current pagination page
				let startIndex = 0;
				let endIndex = totalEntries;

				if (pageSize !== -1 && totalEntries > 0) {
					startIndex = (currentPage - 1) * pageSize;
					endIndex = Math.min(startIndex + pageSize, totalEntries);
				}

				for (let i = startIndex; i < endIndex; i++) {
					if (matchingRows[i]) matchingRows[i].style.display = '';
				}

				// Handle "No sales records found" display
				const noDataRow = document.querySelector('tbody tr td[colspan="9"]')?.parentElement;
				if (noDataRow) {
					noDataRow.style.display = totalEntries === 0 ? '' : 'none';
				}

				// Update pagination text & buttons
				if (totalEntries === 0) {
					pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
				} else {
					const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
					pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
				}

				prevPageBtn.disabled = currentPage <= 1;
				nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;

				if (selectAll) selectAll.checked = false;
			}

			// Event listeners for pagination and search
			if (salesSearch) {
				salesSearch.addEventListener('keyup', () => {
					currentPage = 1;
					updateTableDisplay();
				});
			}

			pageSizeSelect.addEventListener('change', function() {
				pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
				currentPage = 1;
				updateTableDisplay();
			});

			prevPageBtn.addEventListener('click', () => {
				if (currentPage > 1) {
					currentPage--;
					updateTableDisplay();
				}
			});

			nextPageBtn.addEventListener('click', () => {
				currentPage++;
				updateTableDisplay();
			});

			// Select All Checkbox Handler (applies only to visible rows)
			if (selectAll) {
				selectAll.addEventListener('change', function () {
					tableRows.forEach(row => {
						if (row.style.display !== 'none') {
							const cb = row.querySelector('.selectSale');
							if (cb) cb.checked = selectAll.checked;
						}
					});
				});
			}

			// Print Selected Items Handler
			const btnPrint = document.getElementById('btnPrintSelected');
			const printModalEl = document.getElementById('printSalesModal');
			const printModal = new bootstrap.Modal(printModalEl);
			const messageContainer = document.getElementById('printMessage');

			if (btnPrint) {
				btnPrint.addEventListener('click', function () {
					const selectedIds = [...document.querySelectorAll('.selectSale:checked')].map(cb => cb.value);

					if (selectedIds.length === 0) {
						messageContainer.innerHTML = '<p class="text-danger text-center mb-0">Please select at least one sale to print!</p>';
						printModal.show();
						return;
					}

					messageContainer.innerHTML = '';
					window.open("/sales/print/batch?ids=" + selectedIds.join(","), "_blank");
				});
			}

			// Dynamic Modal Loader for Add Sale
			const addSalesModal = document.getElementById('addSalesModal');
			const addFormContainer = document.getElementById('addSalesForm');

			if (addSalesModal) {
				addSalesModal.addEventListener('show.bs.modal', function() {
					fetch('/sales/add')
						.then(response => response.text())
						.then(html => { addFormContainer.innerHTML = html; })
						.catch(error => { addFormContainer.innerHTML = '<p class="text-danger">Failed to load form.</p>'; });
				});

				addSalesModal.addEventListener('hidden.bs.modal', function() {
					addFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
				});
			}

			// Dynamic Modal Loader for Edit Sale
			const editSalesModal = document.getElementById('editSalesModal');
			const editFormContainer = document.getElementById('editSalesForm');

			if (editSalesModal) {
				editSalesModal.addEventListener('show.bs.modal', function(event) {
					const button = event.relatedTarget;
					const saleId = button.getAttribute('data-id');

					fetch(`/sales/edit/${saleId}`)
						.then(response => response.text())
						.then(html => { editFormContainer.innerHTML = html; })
						.catch(error => { editFormContainer.innerHTML = '<p class="text-danger">Failed to load form.</p>'; });
				});

				editSalesModal.addEventListener('hidden.bs.modal', function() {
					editFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
				});
			}

			// Delete Modal Action Builder
			const deleteModal = document.getElementById('deleteModal');
			const deleteForm = document.getElementById('deleteForm');
			const deleteProductName = document.getElementById('deleteProductName');

			if (deleteModal) {
				deleteModal.addEventListener('show.bs.modal', function (event) {
					const button = event.relatedTarget;
					const saleId = button.getAttribute('data-id');
					const customerName = button.getAttribute('data-name');

					deleteProductName.textContent = customerName;
					deleteForm.setAttribute('action', '/sales/delete/' + saleId);
				});
			}

			// Toast Auto-Show
			const toastElList = [].slice.call(document.querySelectorAll('.toast'));
			toastElList.map(function (toastEl) {
				const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
				toast.show();
			});

			// Initial Render
			updateTableDisplay();
		});
	</script>
</body>
</html>
