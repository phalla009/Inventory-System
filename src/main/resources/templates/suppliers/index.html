<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Suppliers-Listing</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<!-- Favicon / Logo -->
<link rel="icon" type="image/png" href="/images/kr.png">
<style type="text/css">
/* ---- Action buttons ---- */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* ---- Table look & feel ---- */
.supplier-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.supplier-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.supplier-table tbody tr {
	transition: background-color .12s ease;
}

.supplier-table tbody tr:hover {
	background-color: #f4f7fb;
}

.supplier-table {
	border-radius: 10px;
	overflow: hidden;
}

.supplier-name {
	font-weight: 600;
	color: #212529;
}

.supplier-email {
	color: #0d6efd;
}

.supplier-address {
	color: #6c757d;
	font-size: .87rem;
}

/* ---- Gender pill ---- */
.gender-pill {
	display: inline-flex;
	align-items: center;
	gap: .3rem;
	padding: .28em .6em;
	border-radius: 999px;
	font-size: .78rem;
	font-weight: 600;
	background-color: rgba(13, 110, 253, .1);
	color: #0d6efd;
}

.gender-pill.female {
	background-color: rgba(214, 51, 132, .1);
	color: #d63384;
}

/* ---- Table wrapper ---- */
.table-scroll-wrap {
	max-height: 450px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main content -->
		<div class="content container-fluid mt-3">
			<h1 class="mb-3">
				<i class="bi bi-truck me-2"></i>Suppliers Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<!-- Error Toast -->
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- ✅ Add Supplier Button -->
			<button type="button" class="btn btn-primary mb-3"
				data-bs-toggle="modal" data-bs-target="#addSupplierModal">
				<i class="bi bi-plus-circle me-1"></i> Add Supplier
			</button>
			<!-- Search Suppliers -->
			<div class="mb-3" style="width: 50%;">
				<div class="input-group">
					<span class="input-group-text"
						style="background-color: white; border-right: 0;"> <i
						class="bi bi-search"></i>
					</span> <input type="text" id="supplierSearch" class="form-control"
						placeholder="Search suppliers by name, email, or phone..."
						style="background-color: white; border-left: 0;">
				</div>
			</div>

			<div class="table-scroll-wrap">
				<!-- ✅ Supplier Table -->
				<table class="table table-hover align-middle supplier-table mb-0">
					<thead class="table-dark text-center"
						style="position: sticky; top: 0; z-index: 2;">
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Gender</th>
							<th>Email</th>
							<th>Phone Number</th>
							<th>Address</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>

						<tr th:each="s ,iterStat: ${suppliers}" class="text-center">
							<td th:text="${iterStat.count}"></td>
							<td class="supplier-name" th:text="${s.name}"></td>
							<td><span class="gender-pill"
								th:classappend="${s.gender == 'Female'} ? 'female' : ''"
								th:text="${s.gender}"></span></td>
							<td class="supplier-email" th:text="${s.email}"></td>
							<td th:text="${s.phone_number}"></td>
							<td class="supplier-address" th:text="${s.address}"></td>
							<td>
								<div class="action-cell">
									<button type="button" class="btn btn-warning btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#editSupplierModal"
										th:attr="data-id=${s.id}" title="Edit Supplier">
										<i class="bi bi-pencil-square"></i>
									</button>
									<button type="button" class="btn btn-danger btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#deleteModal"
										th:attr="data-id=${s.id}, data-name=${s.name}"
										title="Delete Supplier">
										<i class="bi bi-trash"></i>
									</button>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(suppliers)}">
							<td colspan="7" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No suppliers found.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- Add Supplier Modal -->
	<div class="modal fade" id="addSupplierModal" tabindex="-1"
		aria-labelledby="addSupplierModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header bg-primary text-white justify-content-center position-relative">
					<h5 class="modal-title text-center" id="addSupplierModalLabel">
						<i class="bi bi-plus-circle"></i> Add New Supplier
					</h5>

				</div>

				<div class="modal-body" id="addSupplierForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>

			</div>
		</div>
	</div>
	<!-- Edit Supplier Modal -->
	<div class="modal fade" id="editSupplierModal" tabindex="-1"
		aria-labelledby="editSupplierModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">

				<!-- Modal Header -->
				<div
					class="modal-header text-dark justify-content-center position-relative"
					style="background-color: #ffc107;">
					<h5 class="modal-title text-center" id="editSupplierModalLabel">
						<i class="bi bi-pencil-square"></i> Edit Supplier
					</h5>
				</div>


				<!-- Modal Body -->
				<div class="modal-body" id="editSupplierForm">
					<!-- Spinner while loading form -->
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- ✅ Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title" id="deleteModalLabel">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>

				<div class="modal-body text-center">
					<p>Are you sure you want to delete this supplier?</p>
					<p>
						<strong id="deleteSupplierName"></strong>
					</p>
				</div>

				<div class="modal-footer">
					<form id="deleteForm" th:action="@{'/suppliers/delete/'}"
						method="post" class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- ✅ Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
	</script>

	<!-- add new form  -->
	<script>
document.getElementById('supplierSearch').addEventListener('keyup', function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll('tbody tr');

    let visibleCount = 0;

    rows.forEach(row => {
        // Skip "No suppliers found" row
        if (row.querySelector('td[colspan="7"]')) return;

        // Get text from multiple columns: Name, Email, Phone
        const name = row.cells[1].textContent.toLowerCase();
        const email = row.cells[3].textContent.toLowerCase();
        const phone = row.cells[4].textContent.toLowerCase();

        if (name.includes(filter) || email.includes(filter) || phone.includes(filter)) {
            row.style.display = '';
            visibleCount++;
        } else {
            row.style.display = 'none';
        }
    });

    // Show "No suppliers found" row if nothing matches
    const noDataRow = document.querySelector('tbody tr td[colspan="7"]').parentElement;
    if (noDataRow) {
        noDataRow.style.display = visibleCount === 0 ? '' : 'none';
    }
});
</script>

	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    const addSupplierModal = document.getElementById('addSupplierModal');
		    const formContainer = document.getElementById('addSupplierForm');
		
		    addSupplierModal.addEventListener('show.bs.modal', function() {
		        // Fetch the form HTML from your server
		        fetch('/suppliers/add') // Make sure this endpoint returns the fragment 'add_new_products :: form'
		            .then(response => response.text())
		            .then(html => {
		                formContainer.innerHTML = html;
		            })
		            .catch(error => {
		                formContainer.innerHTML = '<p class="text-danger">Failed to load form.</p>';
		                console.error(error);
		            });
		    });
		
		    // Clear form when modal is closed
		    addSupplierModal.addEventListener('hidden.bs.modal', function() {
		        formContainer.innerHTML = '';
		    });
		});
	</script>
	<!-- edit form -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    const editSupplierModal = document.getElementById('editSupplierModal');
		    const formContainer = document.getElementById('editSupplierForm');
	
		    editSupplierModal.addEventListener('show.bs.modal', function(event) {
		        const button = event.relatedTarget;
		        const supplierId = button.getAttribute('data-id'); // use consistent variable name
	
		        // Show spinner while loading
		        formContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
	
		        // Fetch the edit form from the server
		        fetch(`/suppliers/edit/${supplierId}`) 
		            .then(response => {
		                if (!response.ok) throw new Error('Network response was not ok');
		                return response.text();
		            })
		            .then(html => {
		                formContainer.innerHTML = html;
		            })
		            .catch(error => {
		                formContainer.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>';
		                console.error('Error fetching edit form:', error);
		            });
		    });
	
		    // Optional: clear form when modal is hidden
		    editSupplierModal.addEventListener('hidden.bs.modal', function() {
		        formContainer.innerHTML = '';
		    });
		});
		</script>

	<!-- ✅ Auto-hide alerts after 3 seconds -->
	<script>
			setTimeout(() => {
			    const alert = document.querySelector('.alert');
			    if (alert) {
			        const bsAlert = new bootstrap.Alert(alert);
			        bsAlert.close();
			    }
			}, 3000);
	</script>

	<!-- ✅ Delete Modal Logic -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    const deleteModal = document.getElementById('deleteModal');
		    const deleteForm = document.getElementById('deleteForm');
		    const deleteSupplierName = document.getElementById('deleteSupplierName');
		
		    deleteModal.addEventListener('show.bs.modal', function(event) {
		        const button = event.relatedTarget;
		        const supplierId = button.getAttribute('data-id');
		        const supplierName = button.getAttribute('data-name');
		
		        deleteSupplierName.textContent = supplierName;
		        deleteForm.action = '/suppliers/delete/' + supplierId;
		    });
		});
	</script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
		    var toastElList = [].slice.call(document.querySelectorAll('.toast'))
		    toastElList.map(function (toastEl) {
		        var toast = new bootstrap.Toast(toastEl)
		        toast.show()
		    })
		});
	</script>
</body>
</html>
