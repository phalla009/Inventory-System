<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Purchases-Listing</title>

<!-- Bootstrap & Icons CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<!-- Khmer Font & Favicon -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap"
	rel="stylesheet">
<link rel="icon" type="image/png" href="/images/kr.png">

<style type="text/css">
/* Action buttons (Styled like Category & Sales) */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* Table formatting */
.purchases-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.purchases-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.purchases-table tbody tr {
	transition: background-color .12s ease;
}

.purchases-table tbody tr:hover {
	background-color: #f4f7fb;
}

.purchases-table {
	border-radius: 10px;
	overflow: hidden;
}

.supplier-name {
	font-weight: 600;
	color: #212529;
}

/* Table wrapper */
.table-scroll-wrap {
	max-height: 450px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* Custom Pagination Styling */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}

/* Standardized 17" Laptop screen optimization */
@media ( min-width : 1600px) {
	.content {
		padding: 2rem 3rem !important;
	}
	.table-scroll-wrap {
		max-height: 650px;
	}
	.purchases-table thead th {
		font-size: .9rem;
		padding: .9rem 1rem;
	}
	.purchases-table tbody td {
		font-size: 1rem;
		padding: .8rem 1rem;
	}
	.btn-action {
		width: 38px;
		height: 38px;
		font-size: 1.05rem;
	}
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main Content -->
		<div class="content p-4 flex-grow-1">
			<h1 class="mb-3">
				<i class="bi bi-cart-check me-2"></i>Purchases Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- Action Buttons Container -->
			<div class="mb-3 d-flex gap-2">
				<button type="button" class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#addPurchasesModal">
					<i class="bi bi-plus-circle me-1"></i> Add Purchase
				</button>
			</div>

			<!-- Search Input -->
			<div class="mb-3" style="width: 50%;">
				<div class="input-group">
					<span class="input-group-text"
						style="background-color: white; border-right: 0;"> <i
						class="bi bi-search"></i>
					</span> <input type="text" id="purchasesSearch" class="form-control"
						placeholder="Search purchases by supplier or date..."
						style="background-color: white; border-left: 0;">
				</div>
			</div>

			<!-- Table Wrapper -->
			<div class="table-scroll-wrap">
				<table class="table table-hover align-middle purchases-table mb-0">
					<thead class="table-dark sticky-top">
						<tr>
							<th class="text-center" style="width: 60px;">ID</th>
							<th>Supplier</th>
							<th>Total Amount ($)</th>
							<th>Purchase Date</th>
							<th>Created At</th>
							<th class="text-center">Actions</th>
						</tr>
					</thead>
					<tbody style="font-family: 'Noto Sans Khmer', Arial, sans-serif;">
						<tr th:each="purchase, iterStat : ${purchases}">
							<td class="text-center" th:text="${iterStat.count}"></td>
							<td class="supplier-name"
								th:text="${purchase.supplier != null ? purchase.supplier.name : 'N/A'}"></td>
							<td class="fw-bold text-success"
								th:text="${#numbers.formatDecimal(purchase.total_amount, 1, 2)} + ' $'"></td>
							<td
								th:text="${purchase.purchase_date != null ? #temporals.format(purchase.purchase_date, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
							<td class="text-muted"
								th:text="${purchase.created_at != null ? #temporals.format(purchase.created_at, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
							<td class="action-cell">
								<button type="button" class="btn btn-warning btn-sm btn-action"
									data-bs-toggle="modal" data-bs-target="#editPurchasesModal"
									th:attr="data-id=${purchase.id}" title="Edit Purchase">
									<i class="bi bi-pencil-square"></i>
								</button>
								<button type="button" class="btn btn-danger btn-sm btn-action"
									data-bs-toggle="modal" data-bs-target="#deleteModal"
									th:attr="data-id=${purchase.id}, data-name=${purchase.supplier != null ? purchase.supplier.name : 'N/A'}"
									title="Delete Purchase">
									<i class="bi bi-trash"></i>
								</button>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(purchases)}">
							<td colspan="6" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No purchases found.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Pagination & Entries Controls -->
			<div
				class="d-flex justify-content-between align-items-center mt-3 px-1"
				style="font-size: 0.9rem;">
				<!-- Left: Page Size Selector -->
				<div class="d-flex align-items-center gap-2 text-secondary">
					<label for="pageSizeSelect"
						class="form-label mb-0 fw-semibold text-dark">Show</label> <select
						id="pageSizeSelect" class="form-select form-select-sm shadow-none"
						style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
						<option value="10" selected>10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="all">All</option>
					</select> <span>entries per page</span>
				</div>

				<!-- Right: Info Text & Clean Button Group -->
				<div class="d-flex align-items-center gap-3">
					<span id="pageInfo" class="text-secondary">Showing 0 to 0 of
						0 entries</span>

					<div class="btn-group btn-group-sm custom-pagination-group"
						role="group" aria-label="Page Navigation">
						<button type="button" class="btn btn-light border text-secondary"
							id="prevPageBtn" disabled
							style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
							<i class="bi bi-chevron-left me-1"></i> Previous
						</button>
						<button type="button"
							class="btn btn-light border text-primary fw-medium"
							id="nextPageBtn" disabled
							style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
							Next <i class="bi bi-chevron-right ms-1"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Add Purchase Modal -->
	<div class="modal fade" id="addPurchasesModal" tabindex="-1"
		aria-labelledby="addPurchasesModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header bg-primary text-white justify-content-center position-relative">
					<h5 class="modal-title text-center" id="addPurchasesModalLabel">
						<i class="bi bi-plus-circle"></i> Add New Purchase
					</h5>
				</div>
				<div class="modal-body" id="addPurchasesForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit Purchase Modal -->
	<div class="modal fade" id="editPurchasesModal" tabindex="-1"
		aria-labelledby="editPurchasesModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div
					class="modal-header text-dark justify-content-center position-relative"
					style="background-color: #ffc107;">
					<h5 class="modal-title text-center" id="editPurchasesModalLabel">
						<i class="bi bi-pencil-square"></i> Edit Purchase
					</h5>
				</div>
				<div class="modal-body" id="editPurchasesForm">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title" id="deleteModalLabel">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body text-center">
					<p>Are you sure you want to delete this purchase?</p>
					<p>
						<strong id="deletePurchaseName"></strong>
					</p>
				</div>
				<div class="modal-footer">
					<form id="deleteForm" th:action="@{'/purchases/delete/'}"
						method="post" class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Page Scripts -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			// Search & Pagination Controls
			const purchasesSearch = document.getElementById('purchasesSearch');
			const pageSizeSelect = document.getElementById('pageSizeSelect');
			const prevPageBtn = document.getElementById('prevPageBtn');
			const nextPageBtn = document.getElementById('nextPageBtn');
			const pageInfo = document.getElementById('pageInfo');
			const tableRows = Array.from(document.querySelectorAll('tbody tr')).filter(row => !row.querySelector('td[colspan="6"]'));

			let currentPage = 1;
			let pageSize = parseInt(pageSizeSelect.value, 10);

			function updateTableDisplay() {
				const filter = purchasesSearch ? purchasesSearch.value.toLowerCase() : '';

				// Filter rows matching Supplier Name (col index 1) or Purchase Date (col index 3)
				const matchingRows = tableRows.filter(row => {
					const supplierName = row.cells[1]?.textContent.toLowerCase() || '';
					const purchaseDate = row.cells[3]?.textContent.toLowerCase() || '';
					return supplierName.includes(filter) || purchaseDate.includes(filter);
				});

				const totalEntries = matchingRows.length;
				const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

				if (currentPage > totalPages) currentPage = totalPages;
				if (currentPage < 1) currentPage = 1;

				// Hide all data rows
				tableRows.forEach(row => row.style.display = 'none');

				// Slice rows for current page display
				let startIndex = 0;
				let endIndex = totalEntries;

				if (pageSize !== -1 && totalEntries > 0) {
					startIndex = (currentPage - 1) * pageSize;
					endIndex = Math.min(startIndex + pageSize, totalEntries);
				}

				for (let i = startIndex; i < endIndex; i++) {
					if (matchingRows[i]) matchingRows[i].style.display = '';
				}

				// Display "No purchases found" row when no records match search
				const noDataRow = document.querySelector('tbody tr td[colspan="6"]')?.parentElement;
				if (noDataRow) {
					noDataRow.style.display = totalEntries === 0 ? '' : 'none';
				}

				// Update entries info text
				if (totalEntries === 0) {
					pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
				} else {
					const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
					pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
				}

				prevPageBtn.disabled = currentPage <= 1;
				nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;
			}

			// Search Event
			if (purchasesSearch) {
				purchasesSearch.addEventListener('keyup', () => {
					currentPage = 1;
					updateTableDisplay();
				});
			}

			// Page Size Event
			pageSizeSelect.addEventListener('change', function() {
				pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
				currentPage = 1;
				updateTableDisplay();
			});

			// Pagination Button Events
			prevPageBtn.addEventListener('click', () => {
				if (currentPage > 1) {
					currentPage--;
					updateTableDisplay();
				}
			});

			nextPageBtn.addEventListener('click', () => {
				currentPage++;
				updateTableDisplay();
			});

			// Add Purchase Modal Fetch
			const addPurchasesModal = document.getElementById('addPurchasesModal');
			const addFormContainer = document.getElementById('addPurchasesForm');

			if (addPurchasesModal) {
				addPurchasesModal.addEventListener('show.bs.modal', function() {
					fetch('/purchases/add')
						.then(response => response.text())
						.then(html => { addFormContainer.innerHTML = html; })
						.catch(error => {
							addFormContainer.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>';
							console.error(error);
						});
				});

				addPurchasesModal.addEventListener('hidden.bs.modal', function() {
					addFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
				});
			}

			// Edit Purchase Modal Fetch
			const editPurchasesModal = document.getElementById('editPurchasesModal');
			const editFormContainer = document.getElementById('editPurchasesForm');

			if (editPurchasesModal) {
				editPurchasesModal.addEventListener('show.bs.modal', function(event) {
					const button = event.relatedTarget;
					const purchasesId = button.getAttribute('data-id');

					editFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

					fetch(`/purchases/edit/${purchasesId}`)
						.then(response => {
							if (!response.ok) throw new Error('Network response failed');
							return response.text();
						})
						.then(html => { editFormContainer.innerHTML = html; })
						.catch(error => {
							editFormContainer.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>';
							console.error(error);
						});
				});

				editPurchasesModal.addEventListener('hidden.bs.modal', function() {
					editFormContainer.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
				});
			}

			// Delete Modal Action Builder
			const deleteModal = document.getElementById('deleteModal');
			const deleteForm = document.getElementById('deleteForm');
			const deletePurchaseName = document.getElementById('deletePurchaseName');

			if (deleteModal) {
				deleteModal.addEventListener('show.bs.modal', function(event) {
					const button = event.relatedTarget;
					const purchaseId = button.getAttribute('data-id');
					const purchaseName = button.getAttribute('data-name');

					deletePurchaseName.textContent = purchaseName;
					deleteForm.action = '/purchases/delete/' + purchaseId;
				});
			}

			// Toast Auto-Show
			const toastElList = [].slice.call(document.querySelectorAll('.toast'));
			toastElList.map(function (toastEl) {
				const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
				toast.show();
			});

			// Initial Render
			updateTableDisplay();
		});
	</script>
</body>
</html>
