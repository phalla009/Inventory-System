<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Users-Listing</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="/css/style.css">
<!-- Favicon / Logo -->
<link rel="icon" type="image/png" href="/images/kr.png">
<style type="text/css">
/* ---- Action buttons ---- */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4spx;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* ---- Table look & feel ---- */
.user-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.user-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.user-table tbody tr {
	transition: background-color .12s ease;
}

.user-table tbody tr:hover {
	background-color: #f4f7fb;
}

.user-table {
	border-radius: 10px;
	overflow: hidden;
}

/* ---- Username with avatar ---- */
.user-cell {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: .5rem;
}

.user-avatar {
	width: 30px;
	height: 30px;
	border-radius: 50%;
	background-color: rgba(13, 110, 253, .12);
	color: #0d6efd;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: .85rem;
}

.username-text {
	font-weight: 600;
	color: #212529;
}

/* ---- Password dots ---- */
.password-dots {
	letter-spacing: .18em;
	color: #6c757d;
}

/* ---- Role pill ---- */
.role-pill {
	display: inline-flex;
	align-items: center;
	gap: .3rem;
	padding: .3em .7em;
	border-radius: 999px;
	font-size: .78rem;
	font-weight: 600;
	background-color: rgba(111, 66, 193, .12);
	color: #6f42c1;
}

.role-pill.admin {
	background-color: rgba(220, 53, 69, .12);
	color: #dc3545;
}

/* ---- Table wrapper ---- */
.table-scroll-wrap {
	max-height: 450px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main Content -->
		<div class="content p-4 flex-grow-1">
			<h1 class="text-center mb-4">
				<i class="bi bi-person-lines-fill me-2"></i>Users Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<!-- Error Toast -->
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- Add User Button -->
			<button class="btn btn-primary mb-3" data-bs-toggle="modal"
				data-bs-target="#addUserModal">
				<i class="bi bi-plus-circle"></i> Add New User
			</button>

			<!-- Users Table -->
			<div class="table-scroll-wrap">
				<table
					class="table table-hover align-middle text-center user-table mb-0">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>UserName</th>
							<th>Password</th>
							<th>Role</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>

						<tr th:each="user,iterStat: ${users}" class="text-center">
							<td th:text="${iterStat.count}"></td>
							<td>
								<div class="user-cell">
									<span class="user-avatar"><i class="fas fa-user"></i></span> <span
										class="username-text" th:text="${user.username}"></span>
								</div>
							</td>
							<td><span class="password-dots"
								th:text="${'•'.repeat(user.password.length())}"></span></td>
							<td><span class="role-pill"
								th:classappend="${user.role == 'Admin'} ? 'admin' : ''"
								th:text="${user.role}"></span></td>
							<td>
								<div class="action-cell">
									<!-- Edit -->
									<button class="btn btn-warning btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#editUserModal"
										th:attr="data-id=${user.id}" title="Edit User">
										<i class="bi bi-pencil-square"></i>
									</button>
									<!-- Delete -->
									<button class="btn btn-danger btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#deleteModal"
										th:attr="data-id=${user.id}, data-name=${user.username}"
										title="Delete User">
										<i class="bi bi-trash"></i>
									</button>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(users)}">
							<td colspan="5" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No users found.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- Add User Modal -->
	<div class="modal fade" id="addUserModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered"
			style="max-width: 500px;">
			<!-- width-->
			<div class="modal-content" style="height: 60vh;">
				<!-- height  -->
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title text-center w-100">
						<i class="bi bi-person-plus-fill me-2"></i> Add User
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body" id="addUserModalBody">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>


	<!-- Edit User Modal -->
	<div class="modal fade" id="editUserModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered"
			style="max-width: 500px;">
			<div class="modal-content" style="height: 60vh;">
				<div class="modal-header bg-warning text-white">
					<h5 class="modal-title text-center w-100">
						<i class="bi bi-pencil-square me-2"></i> Edit User
					</h5>

					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body" id="editUserModalBody">
					<div class="text-center py-4">
						<div class="spinner-border text-warning"></div>
					</div>
				</div>
			</div>
		</div>
	</div>


	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body text-center">
					<p>Are you sure you want to delete this user?</p>
					<strong id="deleteUserName"></strong>
				</div>
				<div class="modal-footer">
					<form id="deleteForm" th:action="@{/sales/delete/}" method="post"
						class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
	</script>

	<!-- Add/Edit/Delete AJAX -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		
		    // ---- ADD User ----
		    const addUserModal = document.getElementById('addUserModal');
		    const addBody = document.getElementById('addUserModalBody');
		    addUserModal.addEventListener('show.bs.modal', () => {
		        fetch('/user/add-form')
		            .then(res => res.text())
		            .then(html => addBody.innerHTML = html)
		            .catch(() => addBody.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>');
		    });
		    addUserModal.addEventListener('hidden.bs.modal', () => {
		        addBody.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>`;
		    });
		
		    // ---- EDIT User ----
		    const editUserModal = document.getElementById('editUserModal');
			const editBody = document.getElementById('editUserModalBody');
			
			editUserModal.addEventListener('show.bs.modal', function(event) {
			    const id = event.relatedTarget.getAttribute('data-id');
			    fetch(`/user/edit-form/${id}`)
			        .then(res => res.text())
			        .then(html => editBody.innerHTML = html)
			        .catch(() => editBody.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>');
			});
			
			editUserModal.addEventListener('hidden.bs.modal', () => {
			    editBody.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-warning"></div></div>`;
			});
		
		    // ---- DELETE User ----
		    const deleteModal = document.getElementById('deleteModal');
		    const deleteForm = document.getElementById('deleteForm');
		    const deleteUserName = document.getElementById('deleteUserName');
		    deleteModal.addEventListener('show.bs.modal', function(event) {
		        const button = event.relatedTarget;
		        const id = button.getAttribute('data-id');
		        const name = button.getAttribute('data-name');
		        deleteUserName.textContent = name;
		        deleteForm.action = `/user/delete/${id}`;
		    });
		});
	</script>
	<script>
		// Auto-hide success/error messages after 3 seconds
		document.addEventListener('DOMContentLoaded', function() {
		    const alerts = document.querySelectorAll('.alert');
		    alerts.forEach(alert => {
		        setTimeout(() => {
		            const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
		            bsAlert.close();
		        }, 3000); // 3000ms = 3 seconds
		    });
		});
	</script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
		    var toastElList = [].slice.call(document.querySelectorAll('.toast'))
		    toastElList.map(function (toastEl) {
		        var toast = new bootstrap.Toast(toastEl)
		        toast.show()
		    })
		});
	</script>
</body>
</html>
