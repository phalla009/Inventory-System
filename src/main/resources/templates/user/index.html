<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Users-Listing</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="/css/style.css">
<!-- Favicon / Logo -->
<link rel="icon" type="image/png" href="/images/kr.png">
<style type="text/css">
/* ---- Action buttons ---- */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

.action-cell {
	display: flex;
	gap: .4rem;
	flex-wrap: nowrap;
	justify-content: center;
}

/* ---- Table look & feel ---- */
.user-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.user-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.user-table tbody tr {
	transition: background-color .12s ease;
}

.user-table tbody tr:hover {
	background-color: #f4f7fb;
}

.user-table {
	border-radius: 10px;
}

/* ---- Username with avatar ---- */
.user-cell {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: .5rem;
}

.user-avatar {
	width: 30px;
	height: 30px;
	border-radius: 50%;
	background-color: rgba(13, 110, 253, .12);
	color: #0d6efd;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: .85rem;
}

.username-text {
	font-weight: 600;
	color: #212529;
}

/* ---- Password dots ---- */
.password-dots {
	letter-spacing: .18em;
	color: #6c757d;
}

/* ---- Role pill ---- */
.role-pill {
	display: inline-flex;
	align-items: center;
	gap: .3rem;
	padding: .3em .7em;
	border-radius: 999px;
	font-size: .78rem;
	font-weight: 600;
	background-color: rgba(111, 66, 193, .12);
	color: #6f42c1;
}

.role-pill.admin {
	background-color: rgba(220, 53, 69, .12);
	color: #dc3545;
}

/* ---- Table wrapper ---- */
.table-scroll-wrap {
	max-height: 500px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* Custom Pagination Styling */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main Content -->
		<div class="content p-4 flex-grow-1">
			<h1 class="text-center mb-4">
				<i class="bi bi-person-lines-fill me-2"></i>Users Listing
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<!-- Error Toast -->
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- Add User Button -->
			<button class="btn btn-primary mb-3" data-bs-toggle="modal"
				data-bs-target="#addUserModal">
				<i class="bi bi-plus-circle"></i> Add New User
			</button>

			<!-- Search Input -->
			<div class="mb-3" style="width: 50%;">
				<div class="input-group">
					<span class="input-group-text"
						style="background-color: white; border-right: 0;"> <i
						class="bi bi-search"></i>
					</span> <input type="text" id="userSearch" class="form-control"
						placeholder="Search users by username or role..."
						style="background-color: white; border-left: 0;">
				</div>
			</div>

			<!-- Users Table Wrapper -->
			<div class="table-scroll-wrap">
				<table
					class="table table-hover align-middle text-center user-table mb-0">
					<thead class="table-dark sticky-top">
						<tr>
							<th>ID</th>
							<th>UserName</th>
							<th>Password</th>
							<th>Role</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>

						<tr th:each="user,iterStat: ${users}" class="text-center">
							<td th:text="${iterStat.count}"></td>
							<td>
								<div class="user-cell">
									<span class="user-avatar"><i class="fas fa-user"></i></span> <span
										class="username-text" th:text="${user.username}"></span>
								</div>
							</td>
							<td><span class="password-dots"
								th:text="${'•'.repeat(user.password != null ? user.password.length() : 0)}"></span></td>
							<td><span class="role-pill"
								th:classappend="${user.role == 'Admin'} ? 'admin' : ''"
								th:text="${user.role}"></span></td>
							<td>
								<div class="action-cell">
									<!-- Edit -->
									<button class="btn btn-warning btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#editUserModal"
										th:attr="data-id=${user.id}" title="Edit User">
										<i class="bi bi-pencil-square"></i>
									</button>
									<!-- Delete -->
									<button class="btn btn-danger btn-sm btn-action"
										data-bs-toggle="modal" data-bs-target="#deleteModal"
										th:attr="data-id=${user.id}, data-name=${user.username}"
										title="Delete User">
										<i class="bi bi-trash"></i>
									</button>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(users)}">
							<td colspan="5" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No users found.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Pagination & Entries Controls -->
			<div
				class="d-flex justify-content-between align-items-center mt-3 px-1"
				style="font-size: 0.9rem;">
				<!-- Left: Page Size Selector -->
				<div class="d-flex align-items-center gap-2 text-secondary">
					<label for="pageSizeSelect"
						class="form-label mb-0 fw-semibold text-dark">Show</label> <select
						id="pageSizeSelect" class="form-select form-select-sm shadow-none"
						style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
						<option value="10" selected>10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="all">All</option>
					</select> <span>entries per page</span>
				</div>

				<!-- Right: Info Text & Clean Button Group -->
				<div class="d-flex align-items-center gap-3">
					<span id="pageInfo" class="text-secondary">Showing 0 to 0 of
						0 entries</span>

					<div class="btn-group btn-group-sm custom-pagination-group"
						role="group" aria-label="Page Navigation">
						<button type="button" class="btn btn-light border text-secondary"
							id="prevPageBtn" disabled
							style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
							<i class="bi bi-chevron-left me-1"></i> Previous
						</button>
						<button type="button"
							class="btn btn-light border text-primary fw-medium"
							id="nextPageBtn" disabled
							style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
							Next <i class="bi bi-chevron-right ms-1"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Add User Modal -->
	<div class="modal fade" id="addUserModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered"
			style="max-width: 500px;">
			<div class="modal-content" style="height: 60vh;">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title text-center w-100">
						<i class="bi bi-person-plus-fill me-2"></i> Add User
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body" id="addUserModalBody">
					<div class="text-center py-4">
						<div class="spinner-border text-primary"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit User Modal -->
	<div class="modal fade" id="editUserModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered"
			style="max-width: 500px;">
			<div class="modal-content" style="height: 60vh;">
				<div class="modal-header bg-warning text-white">
					<h5 class="modal-title text-center w-100">
						<i class="bi bi-pencil-square me-2"></i> Edit User
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body" id="editUserModalBody">
					<div class="text-center py-4">
						<div class="spinner-border text-warning"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">
						<i class="bi bi-exclamation-triangle"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body text-center">
					<p>Are you sure you want to delete this user?</p>
					<strong id="deleteUserName"></strong>
				</div>
				<div class="modal-footer">
					<form id="deleteForm" th:action="@{/user/delete/}" method="post"
						class="w-100">
						<input type="hidden" name="_method" value="delete">
						<div class="row g-2">
							<div class="col">
								<button type="button" class="btn btn-secondary w-100"
									data-bs-dismiss="modal">
									<i class="bi bi-x-circle me-1"></i> No, keep it
								</button>
							</div>
							<div class="col">
								<button type="submit" class="btn btn-danger w-100">
									<i class="bi bi-trash me-1"></i> Yes, Delete!
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
	</script>

	<!-- Unified Page Logic (Search, Pagination, Modal Async, Toast) -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    // ---- SEARCH & PAGINATION CONTROLS ----
		    const userSearch = document.getElementById('userSearch');
		    const pageSizeSelect = document.getElementById('pageSizeSelect');
		    const prevPageBtn = document.getElementById('prevPageBtn');
		    const nextPageBtn = document.getElementById('nextPageBtn');
		    const pageInfo = document.getElementById('pageInfo');
		    const tableRows = Array.from(document.querySelectorAll('tbody tr')).filter(row => !row.querySelector('td[colspan="5"]'));

		    let currentPage = 1;
		    let pageSize = parseInt(pageSizeSelect.value, 10);

		    function updateTableDisplay() {
		        const filter = userSearch ? userSearch.value.toLowerCase() : '';

		        // Filter rows matching Username (col index 1) or Role (col index 3)
		        const matchingRows = tableRows.filter(row => {
		            const username = row.cells[1]?.textContent.toLowerCase() || '';
		            const role = row.cells[3]?.textContent.toLowerCase() || '';
		            return username.includes(filter) || role.includes(filter);
		        });

		        const totalEntries = matchingRows.length;
		        const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

		        if (currentPage > totalPages) currentPage = totalPages;
		        if (currentPage < 1) currentPage = 1;

		        // Hide all data rows initially
		        tableRows.forEach(row => row.style.display = 'none');

		        // Calculate indices to show current slice
		        let startIndex = 0;
		        let endIndex = totalEntries;

		        if (pageSize !== -1 && totalEntries > 0) {
		            startIndex = (currentPage - 1) * pageSize;
		            endIndex = Math.min(startIndex + pageSize, totalEntries);
		        }

		        for (let i = startIndex; i < endIndex; i++) {
		            if (matchingRows[i]) matchingRows[i].style.display = '';
		        }

		        // Toggle empty record state display
		        const noDataRow = document.querySelector('tbody tr td[colspan="5"]')?.parentElement;
		        if (noDataRow) {
		            noDataRow.style.display = totalEntries === 0 ? '' : 'none';
		        }

		        // Update footer information text
		        if (totalEntries === 0) {
		            pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
		        } else {
		            const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
		            pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
		        }

		        prevPageBtn.disabled = currentPage <= 1;
		        nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;
		    }

		    // Search Event
		    if (userSearch) {
		        userSearch.addEventListener('keyup', () => {
		            currentPage = 1;
		            updateTableDisplay();
		        });
		    }

		    // Page Size Selector Event
		    pageSizeSelect.addEventListener('change', function() {
		        pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
		        currentPage = 1;
		        updateTableDisplay();
		    });

		    // Pagination Buttons Events
		    prevPageBtn.addEventListener('click', () => {
		        if (currentPage > 1) {
		            currentPage--;
		            updateTableDisplay();
		        }
		    });

		    nextPageBtn.addEventListener('click', () => {
		        currentPage++;
		        updateTableDisplay();
		    });

		    // ---- ADD USER MODAL ----
		    const addUserModal = document.getElementById('addUserModal');
		    const addBody = document.getElementById('addUserModalBody');
		    if (addUserModal) {
		        addUserModal.addEventListener('show.bs.modal', () => {
		            fetch('/user/add-form')
		                .then(res => res.text())
		                .then(html => addBody.innerHTML = html)
		                .catch(() => addBody.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>');
		        });
		        addUserModal.addEventListener('hidden.bs.modal', () => {
		            addBody.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>`;
		        });
		    }

		    // ---- EDIT USER MODAL ----
		    const editUserModal = document.getElementById('editUserModal');
		    const editBody = document.getElementById('editUserModalBody');
		    if (editUserModal) {
		        editUserModal.addEventListener('show.bs.modal', function(event) {
		            const id = event.relatedTarget.getAttribute('data-id');
		            fetch(`/user/edit-form/${id}`)
		                .then(res => res.text())
		                .then(html => editBody.innerHTML = html)
		                .catch(() => editBody.innerHTML = '<p class="text-danger text-center">Failed to load form.</p>');
		        });
		        editUserModal.addEventListener('hidden.bs.modal', () => {
		            editBody.innerHTML = `<div class="text-center py-4"><div class="spinner-border text-warning"></div></div>`;
		        });
		    }

		    // ---- DELETE USER MODAL ----
		    const deleteModal = document.getElementById('deleteModal');
		    const deleteForm = document.getElementById('deleteForm');
		    const deleteUserName = document.getElementById('deleteUserName');
		    if (deleteModal) {
		        deleteModal.addEventListener('show.bs.modal', function(event) {
		            const button = event.relatedTarget;
		            const id = button.getAttribute('data-id');
		            const name = button.getAttribute('data-name');
		            deleteUserName.textContent = name;
		            deleteForm.action = `/user/delete/${id}`;
		        });
		    }

		    // ---- ALERTS & TOASTS AUTO-SHOW ----
		    const alerts = document.querySelectorAll('.alert');
		    alerts.forEach(alert => {
		        setTimeout(() => {
		            const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
		            bsAlert.close();
		        }, 3000);
		    });

		    const toastElList = [].slice.call(document.querySelectorAll('.toast'));
		    toastElList.map(function (toastEl) {
		        const toast = new bootstrap.Toast(toastEl);
		        toast.show();
		    });

		    // Initialize Table State
		    updateTableDisplay();
		});
	</script>
</body>
</html>
