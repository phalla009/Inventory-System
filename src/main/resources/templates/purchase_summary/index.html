<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Purchase-Summary-Listing</title>

<!-- Bootstrap & Icons CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<!-- Khmer Font & Favicon -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap"
	rel="stylesheet">
<link rel="icon" type="image/png" href="/images/kr.png">

<style type="text/css">
/* Action buttons styling */
.btn-action {
	width: 34px;
	height: 34px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 4px;
	font-size: .95rem;
	transition: transform .12s ease, box-shadow .12s ease;
}

.btn-action:hover {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
}

/* Table formatting */
.summary-table thead th {
	font-weight: 600;
	font-size: .82rem;
	text-transform: uppercase;
	letter-spacing: .03em;
	vertical-align: middle;
	padding: .75rem .85rem;
}

.summary-table tbody td {
	padding: .65rem .85rem;
	vertical-align: middle;
	font-size: .93rem;
}

.summary-table tbody tr {
	transition: background-color .12s ease;
}

.summary-table tbody tr:hover {
	background-color: #f4f7fb;
}

.summary-table {
	border-radius: 10px;
}

/* Table wrapper */
.table-scroll-wrap {
	max-height: 500px;
	overflow-y: auto;
	border-radius: 10px;
	border: 1px solid #dee2e6;
}

.table-scroll-wrap .table {
	margin-bottom: 0;
}

/* Custom Pagination Styling */
.custom-pagination-group .btn:disabled {
	background-color: #e9ecef !important;
	color: #6c757d !important;
	opacity: 0.85;
}

.custom-pagination-group .btn:not(:disabled):hover {
	background-color: #f1f3f5;
}

/* Standardized screen optimization */
@media ( min-width : 1600px) {
	.content {
		padding: 2rem 3rem !important;
	}
	.table-scroll-wrap {
		max-height: 600px;
	}
	.summary-table thead th {
		font-size: .9rem;
		padding: .9rem 1rem;
	}
	.summary-table tbody td {
		font-size: 1rem;
		padding: .8rem 1rem;
	}
}
</style>
</head>
<body>
	<div class="d-flex">
		<!-- Sidebar -->
		<div th:replace="fragments/sidebar :: sidebar"></div>

		<!-- Main Content -->
		<div class="content p-4 flex-grow-1">
			<h1 class="mb-3 text-center">
				<i class="bi bi-file-text me-2"></i>Purchase Summary
			</h1>

			<!-- Toast Container -->
			<div class="position-fixed top-0 end-0 p-3" style="z-index: 1055;">
				<div th:replace="~{fragments/toasts :: toast-container}"></div>
			</div>

			<!-- Server-side Date Filters & Client-side Live Search -->
			<div class="card shadow-sm border-0 mb-4 bg-light" >
				<div class="col-md-1" style="width:150px;">
					<a
						th:href="@{/purchase-summary/export-excel(week=${selectedWeek}, month=${selectedMonth}, year=${selectedYear})}"
						class="btn btn-success btn-sm w-100" title="Export to Excel">
						<i class="bi bi-file-earmark-excel"> </i> Export to Excel
					</a>
				</div>
				<div class="card-body p-3">
					<form th:action="@{/purchase-summary}" method="get"
						class="row g-2 align-items-end">
						<div class="col-md-2">
							<label class="form-label fw-semibold text-secondary small">Week</label>
							<select name="week" class="form-select form-select-sm">
								<option value="">All Weeks</option>
								<option th:each="w : ${weeks}" th:value="${w}"
									th:text="'Week ' + ${w}" th:selected="${w == selectedWeek}"></option>
							</select>
						</div>
						<div class="col-md-2">
							<label class="form-label fw-semibold text-secondary small">Month</label>
							<select name="month" class="form-select form-select-sm">
								<option value="">All Months</option>
								<option th:each="m : ${months}" th:value="${m}" th:text="${m}"
									th:selected="${m == selectedMonth}"></option>
							</select>
						</div>
						<div class="col-md-2">
							<label class="form-label fw-semibold text-secondary small">Year</label>
							<select name="year" class="form-select form-select-sm">
								<option value="">All Years</option>
								<option th:each="y : ${years}" th:value="${y}" th:text="${y}"
									th:selected="${y == selectedYear}"></option>
							</select>
						</div>
						<div class="col-md-2">
							<button type="submit" class="btn btn-primary btn-sm w-100">
								<i class="bi bi-funnel me-1"></i> Filter Date
							</button>
						</div>
						<div class="col-md-3">
							<label class="form-label fw-semibold text-secondary small">Live
								Search</label>
							<div class="input-group input-group-sm">
								<span class="input-group-text bg-white" id="supplier-icon">
									<i class="bi bi-search"></i>
								</span> <input type="text" id="supplierSearch" class="form-control"
									placeholder="Search by supplier or product...">
							</div>
						</div>

					</form>
				</div>
			</div>

			<!-- Summary Cards -->
			<div class="row mb-3 text-center">
				<div class="col-md-4">
					<div
						class="card border-0 shadow-sm bg-primary bg-opacity-10 text-primary py-2">
						<div class="card-body py-2">
							<div class="text-uppercase fw-semibold small">Total
								Suppliers</div>
							<h4 class="mb-0 fw-bold mt-1" id="cardTotalSuppliers"
								th:text="${totalSupplier}">0</h4>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div
						class="card border-0 shadow-sm bg-success bg-opacity-10 text-success py-2">
						<div class="card-body py-2">
							<div class="text-uppercase fw-semibold small">Total
								Quantity</div>
							<h4 class="mb-0 fw-bold mt-1" id="cardTotalQty"
								th:text="${totalQty}">0</h4>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div
						class="card border-0 shadow-sm bg-warning bg-opacity-10 text-dark py-2">
						<div class="card-body py-2">
							<div
								class="text-uppercase fw-semibold text-warning-emphasis small">Total
								Price ($)</div>
							<h4 class="mb-0 fw-bold mt-1 text-warning-emphasis"
								id="cardTotalPrice"
								th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' $'">0.00
								$</h4>
						</div>
					</div>
				</div>
			</div>

			<!-- Purchases Table Wrap -->
			<div class="table-scroll-wrap">
				<table
					class="table table-hover align-middle summary-table text-center mb-0"
					id="purchaseTable">
					<thead class="table-dark sticky-top">
						<tr>
							<th style="width: 70px;">ID</th>
							<th>Purchase Date</th>
							<th>Product</th>
							<th>Quantity</th>
							<th>Total Amount ($)</th>
							<th>Supplier</th>
						</tr>
					</thead>
					<tbody style="font-family: 'Noto Sans Khmer', Arial, sans-serif;">
						<tr th:each="purchase, iterStat : ${purchaseList}">
							<td th:text="${iterStat.count}">1</td>
							<td
								th:text="${purchase.purchase_date != null ? #temporals.format(purchase.purchase_date, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
							<td class="fw-semibold"
								th:text="${purchase.product != null ? purchase.product.name : 'N/A'}">Product
								Name</td>
							<td class="fw-bold" th:text="${purchase.quantity}">0</td>
							<td class="fw-bold text-success"
								th:text="${#numbers.formatDecimal(purchase.total_amount, 1, 2)} + ' $'">0.00
								$</td>
							<td class="fw-semibold text-dark"
								th:text="${purchase.supplier != null ? purchase.supplier.name : 'N/A'}">Supplier
								Name</td>
						</tr>
						<tr th:if="${#lists.isEmpty(purchaseList)}">
							<td colspan="6" class="text-center py-4 text-muted"><i
								class="bi bi-inbox fs-4 d-block mb-1"></i> No purchases found.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Pagination & Entries Controls -->
			<div
				class="d-flex justify-content-between align-items-center mt-3 px-1"
				style="font-size: 0.9rem;">
				<!-- Left: Page Size Selector -->
				<div class="d-flex align-items-center gap-2 text-secondary">
					<label for="pageSizeSelect"
						class="form-label mb-0 fw-semibold text-dark">Show</label> <select
						id="pageSizeSelect" class="form-select form-select-sm shadow-none"
						style="width: auto; padding-right: 1.8rem; border-color: #dee2e6; border-radius: 6px;">
						<option value="10" selected>10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="all">All</option>
					</select> <span>entries per page</span>
				</div>

				<!-- Right: Info Text & Clean Button Group -->
				<div class="d-flex align-items-center gap-3">
					<span id="pageInfo" class="text-secondary">Showing 0 to 0 of
						0 entries</span>

					<div class="btn-group btn-group-sm custom-pagination-group"
						role="group" aria-label="Page Navigation">
						<button type="button" class="btn btn-light border text-secondary"
							id="prevPageBtn" disabled
							style="background-color: #f8f9fa; border-top-left-radius: 6px; border-bottom-left-radius: 6px;">
							<i class="bi bi-chevron-left me-1"></i> Previous
						</button>
						<button type="button"
							class="btn btn-light border text-primary fw-medium"
							id="nextPageBtn" disabled
							style="border-top-right-radius: 6px; border-bottom-right-radius: 6px;">
							Next <i class="bi bi-chevron-right ms-1"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Page Logic Script -->
	<script>
	document.addEventListener('DOMContentLoaded', function () {
		// DOM Elements
		const supplierSearch = document.getElementById('supplierSearch');
		const pageSizeSelect = document.getElementById('pageSizeSelect');
		const prevPageBtn = document.getElementById('prevPageBtn');
		const nextPageBtn = document.getElementById('nextPageBtn');
		const pageInfo = document.getElementById('pageInfo');

		const cardTotalSuppliers = document.getElementById('cardTotalSuppliers');
		const cardTotalQty = document.getElementById('cardTotalQty');
		const cardTotalPrice = document.getElementById('cardTotalPrice');

		const tableRows = Array.from(document.querySelectorAll('#purchaseTable tbody tr')).filter(row => !row.querySelector('td[colspan="6"]'));

		let currentPage = 1;
		let pageSize = parseInt(pageSizeSelect.value, 10);

		function updateTableDisplay() {
			const filter = supplierSearch ? supplierSearch.value.toLowerCase().trim() : '';

			// Filter by Supplier Name (col index 5) OR Product Name (col index 2)
			const matchingRows = tableRows.filter(row => {
				const productName = row.cells[2]?.textContent.toLowerCase() || '';
				const supplierName = row.cells[5]?.textContent.toLowerCase() || '';
				return supplierName.includes(filter) || productName.includes(filter);
			});

			// Recalculate summary metrics based on search results
			recalculateCards(matchingRows);

			const totalEntries = matchingRows.length;
			const totalPages = pageSize === -1 ? 1 : Math.ceil(totalEntries / pageSize) || 1;

			if (currentPage > totalPages) currentPage = totalPages;
			if (currentPage < 1) currentPage = 1;

			// Hide all data rows
			tableRows.forEach(row => row.style.display = 'none');

			// Calculate row slice indices
			let startIndex = 0;
			let endIndex = totalEntries;

			if (pageSize !== -1 && totalEntries > 0) {
				startIndex = (currentPage - 1) * pageSize;
				endIndex = Math.min(startIndex + pageSize, totalEntries);
			}

			for (let i = startIndex; i < endIndex; i++) {
				if (matchingRows[i]) matchingRows[i].style.display = '';
			}

			// Show empty indicator row if no matches
			const noDataRow = document.querySelector('#purchaseTable tbody tr td[colspan="6"]')?.parentElement;
			if (noDataRow) {
				noDataRow.style.display = totalEntries === 0 ? '' : 'none';
			}

			// Update pagination text info
			if (totalEntries === 0) {
				pageInfo.textContent = 'Showing 0 to 0 of 0 entries';
			} else {
				const startDisplay = pageSize === -1 ? 1 : startIndex + 1;
				pageInfo.textContent = `Showing ${startDisplay} to ${endIndex} of ${totalEntries} entries`;
			}

			prevPageBtn.disabled = currentPage <= 1;
			nextPageBtn.disabled = currentPage >= totalPages || totalEntries === 0;
		}

		// Recalculate Card Summaries dynamically
		function recalculateCards(activeRows) {
			const uniqueSuppliers = new Set();
			let sumQty = 0;
			let sumPrice = 0;

			activeRows.forEach(row => {
				// Supplier
				const supplier = row.cells[5]?.textContent.trim();
				if (supplier && supplier !== 'N/A') uniqueSuppliers.add(supplier);

				// Quantity
				const qty = parseInt(row.cells[3]?.textContent.trim(), 10) || 0;
				sumQty += qty;

				// Price/Amount
				const rawPrice = row.cells[4]?.textContent.replace(/[^0-9.-]+/g, '') || '0';
				sumPrice += parseFloat(rawPrice) || 0;
			});

			if (cardTotalSuppliers) cardTotalSuppliers.textContent = uniqueSuppliers.size;
			if (cardTotalQty) cardTotalQty.textContent = sumQty;
			if (cardTotalPrice) cardTotalPrice.textContent = sumPrice.toFixed(2) + ' $';
		}

		// Search input listener
		if (supplierSearch) {
			supplierSearch.addEventListener('input', () => {
				currentPage = 1;
				updateTableDisplay();
			});
		}

		// Page size change listener
		pageSizeSelect.addEventListener('change', function() {
			pageSize = this.value === 'all' ? -1 : parseInt(this.value, 10);
			currentPage = 1;
			updateTableDisplay();
		});

		// Pagination Buttons
		prevPageBtn.addEventListener('click', () => {
			if (currentPage > 1) {
				currentPage--;
				updateTableDisplay();
			}
		});

		nextPageBtn.addEventListener('click', () => {
			currentPage++;
			updateTableDisplay();
		});

		// Toast Initialization
		const toastElList = [].slice.call(document.querySelectorAll('.toast'));
		toastElList.map(function (toastEl) {
			const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
			toast.show();
		});

		// Initial Execution
		updateTableDisplay();
	});
	</script>

	<!-- Bootstrap JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
